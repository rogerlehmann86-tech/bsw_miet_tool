<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#064b86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BSW Reservation">
  <title>Anmeldung | GVöS Mietportal</title>
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="panel login-card">
      <img class="login-logo" src="assets/logo.jpg" alt="Logo">
      <div class="eyebrow">Geschützter Bereich</div>
      <h1>Anmelden</h1>
      <p class="muted">Bitte verwenden Sie die Zugangsdaten Ihrer Organisation.</p>
      <form id="loginForm">
        <div class="field"><label>E-Mail-Adresse</label><input id="loginUser" type="email" autocomplete="username" required></div>
        <div class="field"><label>Passwort</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <p id="loginError" class="notice error hidden"></p>
        <button class="btn primary full-button">Anmelden</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="login.js?v=1.1"></script>
</body>
</html>
